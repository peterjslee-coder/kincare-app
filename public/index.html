  <script src="/js-compiled/bundle.js?v=1.39.45"></script>

  <script>
    // Service worker: register/update without destroying push subscriptions
    // Previous approach nuked all SWs on every load, which invalidated push endpoints.
    // New approach: clear stale caches but preserve the SW registration so push subscriptions survive.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async function() {
        try {
          // Clear old caches to ensure fresh content (doesn't affect push subscriptions)
          var keys = await caches.keys();
          for (var k of keys) { await caches.delete(k); }

          // Register (or update) the SW — preserves push subscription endpoints
          // skipWaiting() + clients.claim() in sw.js ensure new version activates immediately
          var reg = await navigator.serviceWorker.register('/sw.js');

          // Force the browser to check for script updates now
          reg.update().catch(function() {});

          console.log('SW registered:', reg.scope, '(push subscriptions preserved)');
        } catch (err) {
          console.log('SW setup failed:', err);
        }
      });
    }
  </script>
