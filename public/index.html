<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>InPlace - On-Demand Care for Your Loved Ones</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1b6b5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InPlace">
  <meta name="description" content="On-demand care coordination for your loved ones">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/css/styles.css?v=1.50.20">

  <!-- Leaflet CSS for maps (AreaMap, Caregivers nearby) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Plausible Analytics — privacy-friendly, no cookies, GDPR compliant -->
  <script defer data-domain="yourinplace.com" src="https://plausible.io/js/script.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- React (self-hosted — no CDN dependency) -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>

  <!-- SimpleWebAuthn Browser — passkey/biometric login (self-hosted, was unpkg CDN) -->
  <script src="/vendor/simplewebauthn-browser.min.js"></script>
  <script crossorigin="anonymous" src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <!-- Leaflet JS for maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Stripe.js for payments (no SRI — Stripe serves dynamic versions) -->
  <script src="https://js.stripe.com/v3/"></script>
  <!-- Stripe Connect.js for embedded onboarding (no SRI — dynamic) -->
  <script src="https://connect-js.stripe.com/v1.0/connect.js" async></script>
  <!-- Twilio Video SDK for in-app video/voice calls -->
  <script crossorigin="anonymous" src="https://sdk.twilio.com/js/video/releases/2.28.1/twilio-video.min.js"></script>

  <!-- Pre-compiled app bundle (built by scripts/build-client.js) -->
  <script>window.APP_VERSION = '1.50.88';</script>
  <script src="/js-compiled/bundle.js?v=1.50.88"></script>

  <script>
    // Service worker: register/update and auto-reload on new version
    if ('serviceWorker' in navigator) {
      // Listen for SW_UPDATED messages — auto-reload when new SW activates
      navigator.serviceWorker.addEventListener('message', function(event) {
        if (event.data?.type === 'SW_UPDATED') {
          console.log('SW updated to', event.data.version, '— reloading');
          window.location.reload();
        }
      });

      window.addEventListener('load', async function() {
        try {
          var reg = await navigator.serviceWorker.register('/sw.js');
          // Force check for updates on every page load
          reg.update().catch(function() {});
          console.log('SW registered:', reg.scope);
        } catch (err) {
          console.log('SW setup failed:', err);
        }
      });
    }
  </script>
</body>
</html>
