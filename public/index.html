<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InPlace - On-Demand Care for Your Loved Ones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,200;9..40,300;9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='2' y='2' width='96' height='96' rx='22' fill='%231b6b5a'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-family='sans-serif' font-weight='800' font-size='52' letter-spacing='-3' fill='white'%3EiP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/styles.css?v=0.5.0">
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel CDN -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!--
    Async loader: fetches all modular source files in parallel,
    concatenates in order, and compiles once through Babel.
    Source files live in /js/ for easy editing — one component per file.
  -->
  <script>
    (async function() {
      var scripts = [
        '/js/utils.js',
        '/js/components/InPlaceIcon.js',
        '/js/components/SplashPage.js',
        '/js/components/LoginPage.js',
        '/js/components/RegisterPage.js',
        '/js/components/Dashboard.js',
        '/js/components/CareProfile.js',
        '/js/components/Schedule.js',
        '/js/components/ActivityFeed.js',
        '/js/components/CaregiverScheduleModal.js',
        '/js/components/Caregivers.js',
        '/js/components/CareRecipients.js',
        '/js/components/Messages.js',
        '/js/components/RequestCareModal.js',
        '/js/components/MyAccount.js',
        '/js/components/CaredForView.js',
        '/js/components/CaretakerHub.js',
        '/js/app.js'
      ];
      try {
        var sources = await Promise.all(
          scripts.map(function(url) { return fetch(url + '?v=0.5.0').then(function(r) { return r.text(); }); })
        );
        var combined = sources.join('\n;\n');
        var compiled = Babel.transform(combined, { presets: ['react'] }).code;
        var scriptEl = document.createElement('script');
        scriptEl.textContent = compiled;
        document.body.appendChild(scriptEl);
      } catch (err) {
        console.error('InPlace load error:', err);
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;text-align:center;color:#c00">' +
          '<h2>Loading Error</h2><p>' + err.message + '</p></div>';
      }
    })();
  </script>
</body>
</html>
