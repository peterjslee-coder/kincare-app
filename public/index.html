<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>InPlace - On-Demand Care for Your Loved Ones</title>

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#1b6b5a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="InPlace">
  <meta name="description" content="On-demand care coordination for your loved ones">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/css/styles.css?v=1.39.31">

  <!-- Leaflet CSS for maps (AreaMap, Caregivers nearby) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Plausible Analytics — privacy-friendly, no cookies, GDPR compliant -->
  <script defer data-domain="yourinplace.com" src="https://plausible.io/js/script.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- React + Babel CDN -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- SimpleWebAuthn Browser — passkey/biometric login -->
  <script src="https://unpkg.com/@simplewebauthn/browser@11/dist/bundle/index.umd.min.js"></script>
  <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
  <!-- Leaflet JS for maps -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Stripe.js for payments -->
  <script src="https://js.stripe.com/v3/"></script>
  <!-- Stripe Connect.js for embedded onboarding -->
  <script src="https://connect-js.stripe.com/v1.0/connect.js" async></script>
  <!-- Twilio Video SDK for in-app video/voice calls -->
  <script src="https://sdk.twilio.com/js/video/releases/2.28.1/twilio-video.min.js"></script>

  <!--
    Async loader: fetches all modular source files in parallel,
    concatenates in order, and compiles once through Babel.
    Source files live in /js/ for easy editing — one component per file.
  -->
  <script>
    window.APP_VERSION = '1.39.31';
    (async function() {
      var scripts = [
        '/js/utils.js',
        '/js/components/TimezoneHelper.js',
        '/js/components/InPlaceIcon.js',
        '/js/components/SplashPage.js',
        '/js/components/InviteLandingPage.js',
        '/js/components/LoginPage.js',
        '/js/components/RegisterPage.js',
        '/js/components/ForgotPasswordPage.js',
        '/js/components/ResetPasswordPage.js',
        '/js/components/Dashboard.js',
        '/js/components/CareProfile.js',
        '/js/components/Schedule.js',
        '/js/components/ActivityFeed.js',
        '/js/components/CaregiverScheduleModal.js',
        '/js/components/Caregivers.js',
        '/js/components/CareRecipients.js',
        '/js/components/ConsentVerification.js',
        '/js/components/ConsentResponsePage.js',
        '/js/components/Documents.js',
        '/js/components/VideoCallOverlay.js',
        '/js/components/Messages.js',
        '/js/components/RequestCareModal.js',
        '/js/components/VisitDetailModal.js',
        '/js/components/TwoFactorSetup.js',
        '/js/components/MyAccount.js',
        '/js/components/CareTeamManage.js',
        '/js/components/CareTeamPage.js',
        '/js/components/CaredForView.js',
        '/js/components/AvailabilityTab.js',
        '/js/components/OfferNegotiationPanel.js',
        '/js/components/CaregiverCalendar.js',
        '/js/components/HourReports.js',
        '/js/components/CaretakerHub.js',
        '/js/components/AreaMap.js',
        '/js/components/FindWork.js',
        '/js/components/Analytics.js',
        '/js/components/EmailVerificationBanner.js',
        '/js/components/DisclaimerModal.js',
        '/js/components/FeedbackButton.js',
        '/js/components/NotificationPrompt.js',
        '/js/components/DemoPickerPage.js',
        '/js/components/StripePaymentForm.js',
        '/js/components/CaregiverOnboarding.js',
        '/js/components/FamilyPayments.js',
        '/js/components/AdminFinancials.js',
        '/js/components/HelpPage.js',
        '/js/components/AdminPanel.js',
        '/js/app.js'
      ];
      try {
        // Fetch all scripts in parallel, then concatenate in dependency order
        var sources = await Promise.all(scripts.map(async function(path) {
          var url = path + '?v=1.39.31';
          try {
            var r = await fetch(url);
            if (!r.ok) throw new Error('HTTP ' + r.status + ' for ' + path);
            return await r.text();
          } catch (fetchErr) {
            throw new Error('Failed to load ' + path + ': ' + fetchErr.message);
          }
        }));
        var combined = sources.join('\n;\n');
        var compiled = Babel.transform(combined, { presets: ['react'] }).code;
        var scriptEl = document.createElement('script');
        scriptEl.textContent = compiled;
        document.body.appendChild(scriptEl);
      } catch (err) {
        console.error('InPlace load error:', err);
        document.getElementById('root').innerHTML =
          '<div style="padding:40px;text-align:center;color:#c00">' +
          '<h2>Loading Error</h2><p>' + err.message + '</p>' +
          '<p style="font-size:13px;color:#666;margin-top:12px">Try: pull down to refresh, or reinstall the app.</p></div>';
      }
    })();

    // Service worker: register/update without destroying push subscriptions
    // Previous approach nuked all SWs on every load, which invalidated push endpoints.
    // New approach: clear stale caches but preserve the SW registration so push subscriptions survive.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async function() {
        try {
          // Clear old caches to ensure fresh content (doesn't affect push subscriptions)
          var keys = await caches.keys();
          for (var k of keys) { await caches.delete(k); }

          // Register (or update) the SW — preserves push subscription endpoints
          // skipWaiting() + clients.claim() in sw.js ensure new version activates immediately
          var reg = await navigator.serviceWorker.register('/sw.js');

          // Force the browser to check for script updates now
          reg.update().catch(function() {});

          console.log('SW registered:', reg.scope, '(push subscriptions preserved)');
        } catch (err) {
          console.log('SW setup failed:', err);
        }
      });
    }
  </script>
</body>
</html>
