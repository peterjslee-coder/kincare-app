<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InPlace</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #1b6b5a;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
  }
  .container { padding: 2rem; }
  .logo { font-size: 2.5rem; font-weight: 700; margin-bottom: 1rem; }
  .message { font-size: 1.1rem; opacity: 0.9; margin-bottom: 0.5rem; }
  .dots { font-size: 1.5rem; letter-spacing: 0.3rem; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">InPlace</div>
  <div class="message">Connecting...</div>
  <div class="dots" id="dots">.</div>
</div>
<script>
  // Animate dots
  var dotEl = document.getElementById('dots');
  var count = 1;
  setInterval(function() {
    count = (count % 3) + 1;
    dotEl.textContent = '.'.repeat(count);
  }, 500);

  // Auto-retry loading the app every 2 seconds
  var retries = 0;
  var maxRetries = 15;
  function tryReload() {
    retries++;
    if (retries <= maxRetries) {
      window.location.href = 'https://yourinplace.com';
    } else {
      document.querySelector('.message').textContent = 'Unable to connect. Check your internet and try again.';
      dotEl.textContent = '';
    }
  }
  setTimeout(tryReload, 2000);
</script>
</body>
</html>
