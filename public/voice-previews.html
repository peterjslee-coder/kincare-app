<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Previews - InPlace</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; color: #2C3E50; padding: 24px; }
    h1 { font-size: 22px; margin-bottom: 4px; color: #1A5276; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }
    .sample-text { background: #eef3f7; padding: 12px 16px; border-radius: 8px; font-style: italic; color: #555; margin-bottom: 24px; font-size: 14px; }
    .voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .voice-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .voice-card h3 { font-size: 16px; margin-bottom: 2px; }
    .voice-card .desc { color: #888; font-size: 13px; margin-bottom: 4px; }
    .voice-card .tags { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .tag { background: #eef3f7; color: #1A5276; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .tag.female { background: #fce4ec; color: #c2185b; }
    .tag.male { background: #e3f2fd; color: #1565c0; }
    .play-btn { background: #1A5276; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; width: 100%; }
    .play-btn:hover { background: #2471a3; }
    .play-btn:disabled { background: #999; cursor: wait; }
    .play-btn.playing { background: #e8724a; }
    .suggestion { background: #fff3e0; padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #e65100; margin-top: 8px; }
    audio { width: 100%; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Voice Previews for InPlace</h1>
  <p class="subtitle">Pick voices for reminders and alerts (Pete's voice stays for conversations)</p>
  <div class="sample-text">"Hi Mom... it's time for your afternoon medication... don't forget to take it with a glass of water, okay?"</div>
  <div class="voices" id="voiceGrid"></div>

  <script>
    const voices = [
      { id: "XrExE9yKIg1WjnnlVkGX", name: "Matilda", desc: "Knowledgeable, Professional", gender: "female", age: "Middle-aged", suggestion: "Great for medication reminders" },
      { id: "cgSgspJ2msm6clMCkdW9", name: "Jessica", desc: "Playful, Bright, Warm", gender: "female", age: "Young", suggestion: "Friendly check-ins" },
      { id: "hpp4J3VqNfWAUOO0d1Us", name: "Bella", desc: "Professional, Bright, Warm", gender: "female", age: "Middle-aged", suggestion: "Clean reminders & alerts" },
      { id: "EXAVITQu4vr4xnSDxMaL", name: "Sarah", desc: "Mature, Reassuring, Confident", gender: "female", age: "Young", suggestion: "Reassuring health messages" },
      { id: "nPczCjzI2devNBz1zQrb", name: "Brian", desc: "Deep, Resonant, Comforting", gender: "male", age: "Middle-aged", suggestion: "Calm, grounding reminders" },
      { id: "pqHfZKP75CvOlQylNhV4", name: "Bill", desc: "Wise, Mature, Balanced", gender: "male", age: "Older", suggestion: "Gentle, fatherly tone" },
    ];

    const grid = document.getElementById('voiceGrid');
    let currentAudio = null;

    voices.forEach(voice => {
      const card = document.createElement('div');
      card.className = 'voice-card';
      card.innerHTML = `
        <h3>${voice.name}</h3>
        <div class="desc">${voice.desc}</div>
        <div class="tags">
          <span class="tag ${voice.gender}">${voice.gender}</span>
          <span class="tag">${voice.age}</span>
        </div>
        <button class="play-btn" id="btn-${voice.id}">Play Preview</button>
        <div id="audio-${voice.id}"></div>
        <div class="suggestion">${voice.suggestion}</div>
      `;
      grid.appendChild(card);

      const btn = card.querySelector('.play-btn');
      btn.addEventListener('click', async () => {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        document.querySelectorAll('.play-btn').forEach(b => { b.classList.remove('playing'); b.textContent = 'Play Preview'; });

        btn.disabled = true;
        btn.textContent = 'Loading...';

        try {
          const token = sessionStorage.getItem('companionToken') || localStorage.getItem('auth_token') || '';
          const resp = await fetch(`/api/voice-companion/preview-voice/${voice.id}`, {
            headers: { 'Authorization': 'Bearer ' + token },
            credentials: 'same-origin',
          });
          if (!resp.ok) throw new Error('Failed: ' + resp.status);
          const blob = await resp.blob();
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          currentAudio = audio;

          btn.disabled = false;
          btn.classList.add('playing');
          btn.textContent = 'Playing...';

          audio.play();
          audio.onended = () => {
            btn.classList.remove('playing');
            btn.textContent = 'Play Again';
          };
        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Error - Try Again';
          console.error(err);
        }
      });
    });
  </script>
</body>
</html>
