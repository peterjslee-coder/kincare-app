<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InPlace Caregiver UI Mockup v2 — Dashboard Flow</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }

.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 220px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; padding: 16px 0; }
.main { flex: 1; overflow-y: auto; background: #f8f9fa; }
.content { max-width: 700px; margin: 0 auto; padding: 20px; }

.sidebar-header { padding: 12px 20px 20px; border-bottom: 1px solid #e5e7eb; margin-bottom: 8px; }
.sidebar-header h2 { font-size: 18px; color: #1b6b5a; }
.sidebar-header .role { font-size: 12px; color: #888; margin-top: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 20px; cursor: pointer; font-size: 14px; font-weight: 500; color: #555; transition: all 0.15s; border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: #f0faf7; color: #1b6b5a; }
.nav-item.active { background: #e8f5e9; color: #1b6b5a; font-weight: 700; border-right: 3px solid #1b6b5a; }
.nav-item .icon { font-size: 20px; width: 28px; text-align: center; }
.nav-item.accent { background: #1b6b5a; color: #fff; margin: 4px 12px; border-radius: 10px; justify-content: center; font-weight: 600; }
.nav-item.accent:hover { background: #24897a; }

.bottom-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e5e7eb; z-index: 100; padding: 6px 0 env(safe-area-inset-bottom, 6px); }
.bottom-nav-inner { display: flex; justify-content: space-around; }
.bottom-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 12px; border: none; background: none; cursor: pointer; font-size: 10px; font-weight: 500; color: #888; }
.bottom-btn.active { color: #1b6b5a; font-weight: 700; }
.bottom-btn .icon { font-size: 22px; }

.card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; margin-bottom: 12px; overflow: hidden; }
.card-pad { padding: 16px 20px; }

.section-label { font-size: 12px; font-weight: 700; color: '#555'; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; color: #555; }

/* Money - always big and bold */
.money { font-weight: 800; color: #1b6b5a; }
.money-lg { font-size: 20px; font-weight: 800; color: #1b6b5a; }
.money-xl { font-size: 26px; font-weight: 800; color: #1b6b5a; }
.money-sm { font-size: 14px; font-weight: 800; color: #1b6b5a; }

/* Fade rule for completed */
.fade-1 { opacity: 1; }
.fade-2 { opacity: 0.7; }
.fade-3 { opacity: 0.5; }
.fade-4 { opacity: 0.35; }

/* Annotation badges */
.ann { border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 11px; line-height: 1.5; }
.ann strong { font-weight: 700; }
.ann.change { background: #eff6ff; border: 1px solid #60a5fa; color: #1e40af; }
.ann.new { background: #f0fdf4; border: 1px solid #4ade80; color: #166534; }
.ann.rule { background: #fef3c7; border: 1px solid #f59e0b; color: #92400e; }

/* Sub-tabs */
.sub-tab-bar { display: flex; border-bottom: 1px solid #e5e7eb; margin-bottom: 16px; overflow-x: auto; }
.sub-tab { padding: 10px 16px; border: none; background: none; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
.sub-tab.active { color: #1b6b5a; font-weight: 700; border-bottom-color: #1b6b5a; }

/* Tab bar */
.tab-bar { display: flex; border-bottom: 1px solid #e5e7eb; overflow-x: auto; background: #fff; border-radius: 12px 12px 0 0; }
.tab-btn { padding: 12px 20px; border: none; background: none; font-size: 13px; font-weight: 500; color: #888; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab-btn.active { color: #1b6b5a; font-weight: 700; border-bottom-color: #1b6b5a; }

/* Grid tabs */
.tab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; margin-bottom: 20px; }
.tab-grid-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 14px 8px; border: none; border-radius: 12px; cursor: pointer; min-height: 72px; font-family: inherit; transition: all 0.15s; }

/* Rate cards */
.rate-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.rate-card { background: #f9fafb; border-radius: 10px; padding: 12px; border: 1px solid #e5e7eb; }
.rate-card label { font-size: 11px; color: #888; display: block; margin-bottom: 6px; }

/* Stoplight */
.stoplight-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
.stoplight-label { flex: 1; font-size: 13px; color: #333; }
.light { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.light.green { background: #dcfce7; border-color: #22c55e; }
.light.yellow { background: #fef9c3; border-color: #eab308; }
.light.red { background: #fee2e2; border-color: #ef4444; }
.light.active { box-shadow: 0 0 0 3px rgba(0,0,0,0.15); transform: scale(1.15); }

/* Doc cards */
.doc-card { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #f9fafb; border-radius: 10px; border: 1px solid #e5e7eb; margin-bottom: 8px; }

/* Page selector */
.page-selector { display: flex; gap: 8px; padding: 16px 20px; background: #1b6b5a; position: sticky; top: 0; z-index: 50; flex-wrap: wrap; }
.page-selector button { padding: 8px 16px; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
.page-selector button.active { background: #fff; color: #1b6b5a; border-color: #fff; }

/* Pulse animation for check-in */
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(232,114,74,0.4); } 50% { box-shadow: 0 0 0 8px rgba(232,114,74,0); } }
.pulse { animation: pulse 2s infinite; }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .bottom-nav { display: block; }
  .main { padding-bottom: 70px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState } = React;

// ─── Mock Data ───

// TODAY'S JOB — at the very top, awaiting check-in
const TODAYS_JOBS = [
  { id: 1, name: 'Betty Smith', service: 'Companion Care', time: '2:00 PM', duration: '4hr', earnings: 100, city: 'Blacksburg', address: '123 Main St', minutesUntil: 45, status: 'awaiting_checkin' },
];

// OPEN JOBS NEARBY — merged into Find Work tile
const OPEN_JOBS = [
  { id: 10, family: 'Johnson Family', service: 'Companion Care', date: 'Mon, Mar 3', time: '10:00 AM', duration: '4hr', city: 'Blacksburg', distance: '3.2 mi', earnings: 100 },
  { id: 11, family: 'Garcia Family', service: 'Personal Care', date: 'Tue, Mar 4', time: '8:00 AM', duration: '8hr', city: 'Radford', distance: '8.5 mi', earnings: 240, bonus: true },
  { id: 12, family: 'Chen Family', service: 'Respite Care', date: 'Wed, Mar 5', time: '2:00 PM', duration: '5hr', city: 'Christiansburg', distance: '5.1 mi', earnings: 150 },
];

// NEXT UP — future sessions (not today)
const NEXT_UP = [
  { id: 2, name: 'Martha Jones', service: 'Personal Care', date: 'Tomorrow, Mar 1', time: '9:00 AM', duration: '6hr', earnings: 180, city: 'Christiansburg', status: 'confirmed' },
  { id: 3, name: 'Bob Wilson', service: 'Companion Care', date: 'Sun, Mar 2', time: '1:00 PM', duration: '3hr', earnings: 75, city: 'Radford', status: 'confirmed' },
];

// COMPLETED — with fade rule
const COMPLETED = [
  { id: 100, name: 'Betty Smith', service: 'Companion Care', date: 'Yesterday', time: '2:00 PM', duration: '4hr', earnings: 100, summary: 'Enjoyed a walk in the park. Betty was in great spirits.' },
  { id: 101, name: 'Martha Jones', service: 'Personal Care', date: 'Wed, Feb 25', time: '9:00 AM', duration: '6hr', earnings: 180, summary: 'Helped with morning routine and meal prep.' },
  { id: 102, name: 'Bob Wilson', service: 'Companion Care', date: 'Tue, Feb 24', time: '1:00 PM', duration: '3hr', earnings: 75, summary: 'Played cards and watched TV together.' },
  { id: 103, name: 'Susan Miller', service: 'Respite Care', date: 'Mon, Feb 23', time: '10:00 AM', duration: '5hr', earnings: 150, summary: 'Family respite while daughter ran errands.' },
];

const MOCK_FAMILIES = [
  { id: 1, name: 'Smith Family', recipient: 'Betty Smith', conditions: "Alzheimer's (mild)", address: '123 Main St, Blacksburg', favorite: true },
  { id: 2, name: 'Jones Family', recipient: 'Martha Jones', conditions: 'Mobility issues, diabetes', address: '456 Oak Ave, Christiansburg', favorite: false },
];

const MOCK_REVIEWS = [
  { reviewer: 'Pete Lee', stars: 5, comment: 'Cary was wonderful with mom. Very patient and kind.', date: '2026-02-15' },
  { reviewer: 'Sarah Johnson', stars: 5, comment: 'Excellent caregiver. Always on time and professional.', date: '2026-01-28' },
  { reviewer: 'Maria Garcia', stars: 4, comment: 'Great with dad. Would book again.', date: '2026-01-10' },
];

const STOPLIGHT_ITEMS = [
  'Bathing / Showering', 'Toileting', 'Feeding', 'Medication Reminders',
  'Mobility Assistance', 'Meal Prep', 'Light Housekeeping', 'Companionship',
  'Transportation', 'Dementia / Memory Care',
];

// ─── App ───
const App = () => {
  const [currentPage, setCurrentPage] = useState('home');
  const [homeTab, setHomeTab] = useState('schedule');
  const [findWorkSubTab, setFindWorkSubTab] = useState('jobs');
  const [accountTab, setAccountTab] = useState('profile');
  const [showReviewsModal, setShowReviewsModal] = useState(false);
  const [demoState, setDemoState] = useState('awaiting'); // awaiting | checked_in | checked_out

  const renderSidebar = () => (
    <div className="sidebar">
      <div className="sidebar-header">
        <h2>InPlace</h2>
        <div className="role">Caregiver</div>
      </div>
      <button className={`nav-item ${currentPage === 'home' ? 'active' : ''}`} onClick={() => setCurrentPage('home')}>
        <span className="icon">🏠</span> Home
      </button>
      <button className="nav-item accent" onClick={() => setCurrentPage('find-work')}>
        <span className="icon">🔍</span> Find Work
      </button>
      <button className={`nav-item ${currentPage === 'messages' ? 'active' : ''}`} onClick={() => setCurrentPage('messages')}>
        <span className="icon">💬</span> Messages
      </button>
    </div>
  );

  const renderBottomNav = () => (
    <div className="bottom-nav">
      <div className="bottom-nav-inner">
        {[
          { id: 'home', icon: '🏠', label: 'Home' },
          { id: 'find-work', icon: '🔍', label: 'Find Work' },
          { id: 'messages', icon: '💬', label: 'Messages' },
          { id: 'account', icon: '👤', label: 'Account' },
        ].map(b => (
          <button key={b.id} className={`bottom-btn ${currentPage === b.id ? 'active' : ''}`} onClick={() => setCurrentPage(b.id)}>
            <span className="icon">{b.icon}</span>{b.label}
          </button>
        ))}
      </div>
    </div>
  );

  // ═══════════════════════════════════════════
  // HOME (Dashboard) — redesigned flow
  // ═══════════════════════════════════════════
  const renderHome = () => (
    <div className="content">

      {/* ── Profile bar with clickable rating ── */}
      <div className="card card-pad" style={{ display: 'flex', alignItems: 'center', gap: 16, marginBottom: 16 }}>
        <div style={{ width: 50, height: 50, borderRadius: '50%', background: '#e8f5e9', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 20, fontWeight: 700, color: '#1b6b5a' }}>CT</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 17, fontWeight: 700, color: '#333' }}>Cary Taker</div>
          <div style={{ fontSize: 12, color: '#888' }}>Blacksburg, VA</div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <span className="money-lg">$355</span>
            <span style={{ fontSize: 11, color: '#888' }}>this month</span>
          </div>
        </div>
        <div style={{ textAlign: 'center', cursor: 'pointer', borderLeft: '1px solid #e5e7eb', paddingLeft: 16 }} onClick={() => setShowReviewsModal(true)}>
          <div style={{ fontSize: 18, color: '#f59e0b' }}>⭐ 4.8</div>
          <div style={{ fontSize: 10, color: '#888' }}>3 reviews</div>
        </div>
      </div>

      {/* ══════════════════════════════════════ */}
      {/* SECTION 1: TODAY — check-in cards */}
      {/* ══════════════════════════════════════ */}
      <div className="ann change"><strong>NEW RULE:</strong> Today's jobs always sit at the very top. Shows check-in countdown. Once checked in, stays at top for easy checkout. Once checked out, drops to Completed with fade.</div>

      {demoState === 'awaiting' && (
        <div>
          <div className="section-label" style={{ color: '#e8724a' }}>📍 Today</div>
          {TODAYS_JOBS.map(job => (
            <div key={job.id} style={{
              padding: '20px', borderRadius: 14,
              border: '3px solid #e8724a',
              background: 'linear-gradient(135deg, #fff7ed 0%, #fff 100%)',
              marginBottom: 16,
              boxShadow: '0 4px 16px rgba(232,114,74,0.15)',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                <span style={{ background: '#e8724a', color: '#fff', padding: '3px 10px', borderRadius: 12, fontSize: 11, fontWeight: 700, textTransform: 'uppercase' }}>Check in in 45 min</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 18, fontWeight: 700, color: '#333' }}>{job.name}</div>
                  <div style={{ fontSize: 14, color: '#666', marginTop: 3 }}>
                    {job.service} · {job.time} · {job.duration}
                  </div>
                  <div style={{ fontSize: 13, color: '#888', marginTop: 2 }}>📍 {job.address}, {job.city}</div>
                  <div className="money-lg" style={{ marginTop: 8 }}>${job.earnings}</div>
                </div>
                <button onClick={() => setDemoState('checked_in')} className="pulse" style={{
                  padding: '14px 28px', background: '#e8724a', color: '#fff', border: 'none',
                  borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: 'pointer',
                  boxShadow: '0 4px 12px rgba(232,114,74,0.35)',
                }}>Check In</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {demoState === 'checked_in' && (
        <div>
          <div className="section-label" style={{ color: '#f57f17' }}>⏱️ In Progress</div>
          <div className="ann new"><strong>DEMO:</strong> Betty is checked in — stays at top for easy checkout.</div>
          {TODAYS_JOBS.map(job => (
            <div key={job.id} style={{
              padding: '20px', borderRadius: 14,
              border: '3px solid #f57f17',
              background: 'linear-gradient(135deg, #fffde7 0%, #fff 100%)',
              marginBottom: 16,
              boxShadow: '0 4px 16px rgba(245,127,23,0.15)',
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
                <span style={{ background: '#f57f17', color: '#fff', padding: '3px 10px', borderRadius: 12, fontSize: 11, fontWeight: 700, textTransform: 'uppercase' }}>In Progress — 1hr 23min</span>
              </div>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 18, fontWeight: 700, color: '#333' }}>{job.name}</div>
                  <div style={{ fontSize: 14, color: '#666', marginTop: 3 }}>
                    {job.service} · Started 2:00 PM · {job.duration}
                  </div>
                  <div style={{ fontSize: 13, color: '#888', marginTop: 2 }}>📍 {job.address}, {job.city}</div>
                  <div className="money-lg" style={{ marginTop: 8 }}>${job.earnings}</div>
                </div>
                <button onClick={() => setDemoState('checked_out')} style={{
                  padding: '14px 28px', background: '#c62828', color: '#fff', border: 'none',
                  borderRadius: 12, fontSize: 16, fontWeight: 700, cursor: 'pointer',
                  boxShadow: '0 4px 12px rgba(198,40,40,0.3)',
                }}>Check Out</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {demoState === 'checked_out' && (
        <div className="ann new"><strong>DEMO:</strong> Betty checked out — she moved to Completed section below with fade rule. Click "Reset Demo" to restart.</div>
      )}

      {demoState === 'checked_out' && (
        <button onClick={() => setDemoState('awaiting')} style={{
          padding: '8px 16px', background: '#f0f0f0', border: 'none', borderRadius: 8, fontSize: 12, cursor: 'pointer', marginBottom: 12,
        }}>↩ Reset Demo</button>
      )}

      {/* ══════════════════════════════════════ */}
      {/* SECTION 2: Find Work + Available Jobs (merged tile) */}
      {/* ══════════════════════════════════════ */}
      <div className="ann change"><strong>MERGED:</strong> "Find Work" CTA + "Available Jobs Nearby" are now one tile. Accept jobs straight from here, or tap "View all" for map/availability/rates.</div>

      <div style={{
        borderRadius: 14, overflow: 'hidden', marginBottom: 20,
        border: '1px solid #d4edda',
        background: '#fff',
      }}>
        {/* Header */}
        <div style={{
          background: 'linear-gradient(135deg, #1b6b5a 0%, #24897a 100%)',
          color: '#fff', padding: '16px 20px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          cursor: 'pointer',
        }} onClick={() => setCurrentPage('find-work')}>
          <div>
            <div style={{ fontWeight: 700, fontSize: 17 }}>🔍 Find Work</div>
            <div style={{ fontSize: 12, opacity: 0.9, marginTop: 2 }}>{OPEN_JOBS.length} open jobs near you</div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: 12, opacity: 0.8 }}>Map · Availability · Rates</span>
            <span style={{ fontSize: 22, opacity: 0.7 }}>→</span>
          </div>
        </div>

        {/* Job list inside the tile */}
        <div style={{ padding: '4px 0' }}>
          {OPEN_JOBS.map((job, i) => (
            <div key={job.id} style={{
              padding: '14px 20px',
              borderBottom: i < OPEN_JOBS.length - 1 ? '1px solid #f0f0f0' : 'none',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12,
            }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                  {job.bonus && <span style={{ background: '#e8724a', color: '#fff', padding: '2px 8px', borderRadius: 12, fontSize: 10, fontWeight: 700 }}>BONUS</span>}
                  <span style={{ fontSize: 14, fontWeight: 600, color: '#333' }}>{job.service}</span>
                </div>
                <div style={{ fontSize: 12, color: '#666' }}>
                  📅 {job.date} · {job.time} · {job.duration}
                </div>
                <div style={{ fontSize: 12, color: '#888', marginTop: 1 }}>
                  📍 {job.city} · {job.distance} · {job.family}
                </div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="money-lg">${job.earnings}</div>
                <button style={{
                  marginTop: 4, padding: '7px 16px', background: '#e8724a', color: '#fff', border: 'none',
                  borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: 'pointer',
                }}>Accept</button>
              </div>
            </div>
          ))}
        </div>

        {/* Footer */}
        <div style={{ textAlign: 'center', padding: '10px', borderTop: '1px solid #f0f0f0' }}>
          <span onClick={() => setCurrentPage('find-work')} style={{ fontSize: 13, color: '#1b6b5a', fontWeight: 600, cursor: 'pointer' }}>
            View all jobs, map & availability →
          </span>
        </div>
      </div>

      {/* ══════════════════════════════════════ */}
      {/* SECTION 3: Next Up — future sessions (NOT today) */}
      {/* ══════════════════════════════════════ */}
      <div className="ann change"><strong>RULE:</strong> Next Up only shows future sessions (not today). Today's jobs are always at the top.</div>

      <div className="section-label">Next Up</div>
      {NEXT_UP.map(s => (
        <div key={s.id} className="card" style={{
          padding: '16px 18px', marginBottom: 10,
          border: '2px solid #1b6b5a', borderRadius: 12,
        }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#888', marginBottom: 3 }}>
                {s.date === 'Tomorrow, Mar 1' ? 'tomorrow' : s.date}
              </div>
              <div style={{ fontSize: 15, fontWeight: 600, color: '#333' }}>{s.name}</div>
              <div style={{ fontSize: 13, color: '#666', marginTop: 2 }}>
                {s.time} · {s.duration} · {s.service}
              </div>
              <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>📍 {s.city}</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <span style={{ padding: '5px 12px', borderRadius: 10, fontSize: 11, fontWeight: 600, background: '#e8f5e9', color: '#2e7d32' }}>Confirmed</span>
              <div className="money-lg" style={{ marginTop: 6 }}>${s.earnings}</div>
            </div>
          </div>
        </div>
      ))}

      {/* ══════════════════════════════════════ */}
      {/* SECTION 4: Completed — fade rule */}
      {/* ══════════════════════════════════════ */}
      <div className="ann rule"><strong>FADE RULE:</strong> Only last 2 completed sessions shown. Most recent = full opacity, second fades. Earnings always big & bold.</div>

      <div style={{ marginTop: 8 }}>
        <div className="section-label" style={{ color: '#999' }}>Completed</div>

        {/* If Betty was just checked out, she appears first at full opacity */}
        {demoState === 'checked_out' && (
          <div className="fade-1" style={{
            padding: '14px 18px', borderRadius: 12, marginBottom: 8,
            background: '#f8faf9', border: '1px solid #d4edda',
          }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 11, color: '#2e7d32', fontWeight: 600, marginBottom: 2 }}>✓ Just completed</div>

                <div style={{ fontSize: 12, color: '#666', marginTop: 2 }}>Today at 2:00 PM · 4hr · Companion Care</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <span style={{ padding: '3px 10px', borderRadius: 10, fontSize: 11, fontWeight: 600, background: '#e8f5e9', color: '#2e7d32' }}>✓ Done</span>

        {/* Only show last 2 completed (or 1 if Betty just checked out, since she takes a slot) */}

          const fadeIdx = demoState === 'checked_out' ? i + 1 : i;
          const fadeClass = fadeIdx === 0 ? 'fade-1' : 'fade-2';

          return (
            <div key={s.id} className={fadeClass} style={{
              padding: '14px 18px', borderRadius: 12, marginBottom: 8,
              background: '#fafafa', border: '1px solid #e5e7eb',

              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 600, color: '#333' }}>{s.name}</div>
                  <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>
                    {s.date} · {s.time} · {s.duration} · {s.service}
                  </div>
                  {s.summary && <div style={{ fontSize: 12, color: '#666', marginTop: 3, fontStyle: 'italic' }}>{s.summary.length > 70 ? s.summary.substring(0, 70) + '...' : s.summary}</div>}

                <div style={{ textAlign: 'right' }}>
                  <span style={{ padding: '3px 10px', borderRadius: 10, fontSize: 11, fontWeight: 600, background: '#e8f5e9', color: '#2e7d32' }}>✓ Done</span>

      {/* ── Calendar — rendered directly, no tab grid needed ── */}
      <div className="ann change"><strong>SIMPLIFIED:</strong> Hour Reports moved to Account → Payments tab. Only Calendar remains, so no tab selector needed — it just renders.</div>

        <div className="section-label">📅 Calendar</div>
        <div className="card card-pad" style={{ minHeight: 120, display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#aaa', fontSize: 13 }}>

      {showReviewsModal && (

          <div style={{ background: '#fff', borderRadius: 12, padding: 24, width: 420, maxWidth: '90vw', maxHeight: '80vh', overflow: 'auto' }} onClick={e => e.stopPropagation()}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <h3 style={{ margin: 0, fontSize: 18, color: '#333' }}>⭐ Your Reviews (3)</h3>
              <button onClick={() => setShowReviewsModal(false)} style={{ background: 'none', border: 'none', fontSize: 20, cursor: 'pointer', color: '#888' }}>✕</button>
            </div>
            {MOCK_REVIEWS.map((r, i) => (
              <div key={i} style={{ padding: '12px 0', borderBottom: i < MOCK_REVIEWS.length - 1 ? '1px solid #f0f0f0' : 'none' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
                  <div style={{ fontWeight: 600, fontSize: 14 }}>{r.reviewer}</div>
                  <div style={{ color: '#f59e0b' }}>{'⭐'.repeat(r.stars)}</div>
                </div>
                <div style={{ fontSize: 13, color: '#555', lineHeight: 1.5 }}>{r.comment}</div>
                <div style={{ fontSize: 11, color: '#aaa', marginTop: 4 }}>{r.date}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );

  // ═══════════════════════════════════════════
  // FIND WORK — sub-tabs (unchanged from v1)
  // ═══════════════════════════════════════════
  const renderFindWork = () => (
    <div className="content">
      <h2 style={{ fontSize: 20, fontWeight: 700, color: '#333', marginBottom: 16 }}>🔍 Find Work</h2>

      <div className="sub-tab-bar">
        {[
          { id: 'jobs', label: '🔔 Open Jobs' },
          { id: 'availability', label: '🕐 Availability' },
          { id: 'rates', label: '💰 My Rates' },
          { id: 'families', label: '👪 My Families' },
        ].map(t => (
          <button key={t.id} className={`sub-tab ${findWorkSubTab === t.id ? 'active' : ''}`} onClick={() => setFindWorkSubTab(t.id)}>
            {t.label}
          </button>
        ))}
      </div>

      {findWorkSubTab === 'jobs' && (
        <div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
            <button style={{ padding: '6px 14px', background: '#1b6b5a', color: '#fff', border: 'none', borderRadius: 8, fontSize: 12, fontWeight: 600 }}>📋 List</button>
            <button style={{ padding: '6px 14px', background: '#f0f0f0', color: '#555', border: 'none', borderRadius: 8, fontSize: 12, fontWeight: 600 }}>🗺️ Map</button>

              <option>All Services</option>
            </select>
          </div>
          {OPEN_JOBS.map(job => (
            <div key={job.id} className="card card-pad" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, borderLeft: job.bonus ? '3px solid #e8724a' : undefined }}>

                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4 }}>
                  {job.bonus && <span style={{ background: '#e8724a', color: '#fff', padding: '2px 8px', borderRadius: 12, fontSize: 10, fontWeight: 700 }}>BONUS</span>}
                </div>
                <div style={{ fontSize: 15, fontWeight: 600, color: '#333' }}>{job.service}</div>
                <div style={{ fontSize: 13, color: '#666', marginTop: 2 }}>📅 {job.date} · {job.time} · {job.duration}</div>
                <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>📍 {job.city} · {job.distance} · {job.family}</div>
              </div>
              <div style={{ textAlign: 'right' }}>
                <div className="money-xl">${job.earnings}</div>
                <button style={{ marginTop: 6, padding: '10px 20px', background: '#e8724a', color: '#fff', border: 'none', borderRadius: 10, fontSize: 14, fontWeight: 700, cursor: 'pointer' }}>Accept</button>
              </div>
            </div>
          ))}
        </div>
      )}

      {findWorkSubTab === 'availability' && (
        <div className="card card-pad">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
            <h3 style={{ margin: 0, fontSize: 16 }}>Your Availability</h3>
            <button style={{ padding: '8px 16px', background: '#1b6b5a', color: '#fff', border: 'none', borderRadius: 8, fontSize: 13, fontWeight: 600 }}>+ Add Rule</button>
          </div>
          {['Monday', 'Wednesday', 'Friday'].map(day => (
            <div key={day} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 0', borderBottom: '1px solid #f0f0f0' }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 600, color: '#333' }}>{day}</div>
                <div style={{ fontSize: 12, color: '#888' }}>8:00 AM – 5:00 PM · Recurring</div>
              </div>
              <span style={{ padding: '3px 10px', borderRadius: 10, fontSize: 11, fontWeight: 600, background: '#e8f5e9', color: '#2e7d32' }}>Available</span>
            </div>
          ))}
        </div>
      )}

      {findWorkSubTab === 'rates' && (
        <div className="card card-pad">
          <h3 style={{ margin: '0 0 4px', fontSize: 16 }}>Your Rate Card</h3>
          <p style={{ fontSize: 13, color: '#666', margin: '0 0 16px' }}>These rates calculate your earnings for each job.</p>
          <div className="rate-group">
            <div className="rate-card">
              <label>☀️ Daytime (7am–6pm)</label>
              <div className="money-xl">$25<span style={{ fontSize: 14 }}>/hr</span></div>
            </div>
            <div className="rate-card">
              <label>🌙 Evening (6pm–12am)</label>
              <div className="money-xl">$30<span style={{ fontSize: 14 }}>/hr</span></div>
            </div>
            <div className="rate-card">
              <label>🌃 Overnight (12am–7am)</label>
              <div className="money-xl">$35<span style={{ fontSize: 14 }}>/hr</span></div>
            </div>
          </div>
          <button style={{ marginTop: 16, width: '100%', padding: '12px', background: '#1b6b5a', color: '#fff', border: 'none', borderRadius: 10, fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Save Rates</button>
        </div>
      )}

      {findWorkSubTab === 'families' && (
        <div>
          {MOCK_FAMILIES.map(f => (
            <div key={f.id} className="card card-pad">
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
                <div style={{ fontSize: 16, fontWeight: 700 }}>{f.name}</div>
                {f.favorite && <span style={{ fontSize: 12, color: '#f59e0b' }}>⭐ Favorite</span>}
              </div>
              <div style={{ fontSize: 14, color: '#555' }}>Care recipient: <strong>{f.recipient}</strong></div>
              <div style={{ fontSize: 13, color: '#888', marginTop: 4 }}>🏥 {f.conditions}</div>
              <div style={{ fontSize: 13, color: '#888', marginTop: 2 }}>📍 {f.address}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  // ═══════════════════════════════════════════
  // ACCOUNT — (unchanged from v1)
  // ═══════════════════════════════════════════

        {[
          { id: 'profile', label: 'Profile' },

          { id: 'payments', label: 'Payments' },
          { id: 'documents', label: 'Documents' },
          { id: 'preferences', label: 'Care Prefs' },

          <button key={t.id} className={`tab-btn ${accountTab === t.id ? 'active' : ''}`} onClick={() => setAccountTab(t.id)}>
            {t.label}
          </button>

          <div className="card-pad">
            <h3 style={{ margin: '0 0 16px', fontSize: 16 }}>Security</h3>
            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Password</div>
              <button style={{ padding: '8px 16px', background: '#f0f0f0', border: 'none', borderRadius: 8, fontSize: 13, cursor: 'pointer' }}>Change Password</button>
            </div>
            <div style={{ marginBottom: 20, paddingTop: 16, borderTop: '1px solid #f0f0f0' }}>

              <div>
                <div style={{ fontSize: 14, fontWeight: 600 }}>💳 Stripe Connect</div>
                <div style={{ fontSize: 12, color: '#888', marginTop: 2 }}>Connected — payouts enabled</div>
              </div>
              <span style={{ padding: '4px 12px', borderRadius: 10, fontSize: 11, fontWeight: 600, background: '#e8f5e9', color: '#2e7d32' }}>Active</span>
            </div>
            <div style={{ padding: 16, background: '#f9fafb', borderRadius: 10, border: '1px solid #e5e7eb', marginBottom: 12 }}>
              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 8 }}>Payout Speed</div>
              <div style={{ display: 'flex', gap: 8 }}>
                <button style={{ flex: 1, padding: 12, borderRadius: 8, border: '2px solid #1b6b5a', background: '#e8f5e9', fontSize: 13, fontWeight: 600, color: '#1b6b5a' }}>Standard (2-3 days)</button>
                <button style={{ flex: 1, padding: 12, borderRadius: 8, border: '1px solid #ddd', background: '#fff', fontSize: 13, color: '#888' }}>Instant (1% fee)</button>
              </div>
            </div>
            <div style={{ padding: 16, background: '#f0fdf4', borderRadius: 10, border: '1px solid #d4edda', marginBottom: 16 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: '#166534', marginBottom: 4 }}>💡 How you get paid</div>
              <div style={{ fontSize: 12, color: '#555', lineHeight: 1.6 }}>InPlace takes a 15% platform fee. You receive 85%. Payouts happen on your chosen schedule after each completed session.</div>
            </div>

            {/* Hour Reports — moved from Dashboard */}
            <div style={{ borderTop: '2px solid #e5e7eb', paddingTop: 16, marginTop: 8 }}>
              <div className="ann new"><strong>MOVED HERE:</strong> Hour Reports moved from Dashboard tabs. Calendar is the only thing on Home now — no tab grid needed.</div>
              <h4 style={{ margin: '0 0 12px', fontSize: 15, color: '#333' }}>📊 Hour Reports</h4>
              <div style={{ padding: 40, background: '#f9fafb', borderRadius: 10, border: '1px solid #e5e7eb', textAlign: 'center', color: '#aaa', fontSize: 13 }}>

              </div>
            </div>
          </div>
        )}
        {accountTab === 'documents' && (
          <div className="card-pad">
            <h3 style={{ margin: '0 0 16px', fontSize: 16 }}>Documents</h3>
            {[
              { icon: '🪪', name: "Driver's License / ID", status: '✓ Uploaded Feb 10, 2026', done: true },
              { icon: '📜', name: 'Certifications', status: 'No file uploaded', done: false },
              { icon: '🔍', name: 'Background Check', status: '✓ Completed Jan 20, 2026', done: true },
            ].map((d, i) => (
              <div key={i} className="doc-card">
                <div style={{ fontSize: 24 }}>{d.icon}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 14, fontWeight: 600 }}>{d.name}</div>
                  <div style={{ fontSize: 12, color: d.done ? '#2e7d32' : '#888' }}>{d.status}</div>
                </div>
                {!d.done && <button style={{ padding: '6px 14px', background: '#1b6b5a', color: '#fff', border: 'none', borderRadius: 8, fontSize: 12 }}>Upload</button>}
              </div>
            ))}
          </div>
        )}
        {accountTab === 'preferences' && (
          <div className="card-pad">
            <h3 style={{ margin: '0 0 4px', fontSize: 16 }}>Care Preferences</h3>
            <p style={{ fontSize: 13, color: '#666', margin: '0 0 16px' }}>Rate your comfort level with each care task.</p>
            {STOPLIGHT_ITEMS.map((item, i) => {
              const colors = ['green', 'green', 'yellow', 'green', 'green', 'green', 'green', 'green', 'yellow', 'red'];
              return (
                <div key={item} className="stoplight-row">
                  <div className="stoplight-label">{item}</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    <div className={`light green ${colors[i] === 'green' ? 'active' : ''}`}>✓</div>
                    <div className={`light yellow ${colors[i] === 'yellow' ? 'active' : ''}`}>~</div>
                    <div className={`light red ${colors[i] === 'red' ? 'active' : ''}`}>✕</div>
                  </div>
                </div>

            })}
            <button style={{ marginTop: 16, width: '100%', padding: 12, background: '#1b6b5a', color: '#fff', border: 'none', borderRadius: 10, fontSize: 14, fontWeight: 600, cursor: 'pointer' }}>Save Preferences</button>
          </div>
        )}
      </div>
    </div>
  );

  // ═══════════════════════════════════════════
  // Summary page
  // ═══════════════════════════════════════════
  const renderSummary = () => (
    <div className="content">
      <h2 style={{ fontSize: 20, fontWeight: 700, color: '#333', marginBottom: 16 }}>📋 Dashboard Flow (v2 Changes)</h2>

      <div className="card card-pad">
        <h3 style={{ margin: '0 0 12px', fontSize: 16, color: '#1b6b5a' }}>Dashboard Section Order</h3>
        <table style={{ width: '100%', fontSize: 13, borderCollapse: 'collapse' }}>

            <tr style={{ borderBottom: '2px solid #e5e7eb' }}>

            </tr>
          </thead>
          <tbody>
            <tr style={{ borderBottom: '1px solid #f0f0f0', background: '#fff7ed' }}><td style={{ padding: '8px 4px', fontWeight: 700 }}>1</td><td style={{ padding: '8px 4px', fontWeight: 700, color: '#e8724a' }}>📍 Today</td><td style={{ padding: '8px 4px' }}>Today's jobs only. "Check in in X min". Stays at top during session for easy checkout.</td></tr>
            <tr style={{ borderBottom: '1px solid #f0f0f0', background: '#f0fdf4' }}><td style={{ padding: '8px 4px', fontWeight: 700 }}>2</td><td style={{ padding: '8px 4px', fontWeight: 700, color: '#1b6b5a' }}>🔍 Find Work + Jobs</td><td style={{ padding: '8px 4px' }}>Merged CTA + available jobs. Accept inline or tap to see map/availability/rates.</td></tr>
            <tr style={{ borderBottom: '1px solid #f0f0f0' }}><td style={{ padding: '8px 4px', fontWeight: 700 }}>3</td><td style={{ padding: '8px 4px', fontWeight: 700 }}>Next Up</td><td style={{ padding: '8px 4px' }}>Future sessions (not today). Confirmed jobs with earnings shown.</td></tr>
            <tr style={{ borderBottom: '1px solid #f0f0f0', background: '#fafafa' }}><td style={{ padding: '8px 4px', fontWeight: 700 }}>4</td><td style={{ padding: '8px 4px', fontWeight: 700, color: '#999' }}>Completed</td><td style={{ padding: '8px 4px' }}>Only last 2 shown. Fade rule: newest = full opacity, second fades. Earnings bold.</td></tr>
            <tr><td style={{ padding: '8px 4px', fontWeight: 700 }}>5</td><td style={{ padding: '8px 4px', fontWeight: 700, color: '#555' }}>📅 Calendar</td><td style={{ padding: '8px 4px' }}>Renders directly — no tab grid. Hour Reports moved to Account → Payments tab.</td></tr>
          </tbody>
        </table>
      </div>

      <div className="card card-pad">
        <h3 style={{ margin: '0 0 12px', fontSize: 16, color: '#1b6b5a' }}>Money Rule</h3>
        <p style={{ fontSize: 13, color: '#555', lineHeight: 1.6 }}>
          Anywhere money appears, the text is <span className="money-lg">bigger and bolder</span> — job cards, earnings summary, completed sessions, rate cards. Uses the CSS class <code>.money-lg</code> / <code>.money-xl</code>.
        </p>
      </div>

      <div className="card card-pad">
        <h3 style={{ margin: '0 0 12px', fontSize: 16, color: '#1b6b5a' }}>Check-in / Check-out Lifecycle</h3>
        <div style={{ fontSize: 13, color: '#555', lineHeight: 1.8 }}>
          <strong>1. Awaiting:</strong> "Check in in 45 min" — orange border, pulsing button<br/>
          <strong>2. Checked in:</strong> "In Progress — 1hr 23min" — yellow border, Check Out button<br/>
          <strong>3. Checked out:</strong> Drops to Completed section at full opacity, others fade down<br/>
          <em style={{ color: '#888' }}>Try the interactive demo on the Home page!</em>
        </div>
      </div>
    </div>
  );

  return (
    <div className="app">
      {renderSidebar()}
      <div className="main">
        <div className="page-selector">
          <button className={currentPage === 'home' ? 'active' : ''} onClick={() => setCurrentPage('home')}>🏠 Home</button>
          <button className={currentPage === 'find-work' ? 'active' : ''} onClick={() => setCurrentPage('find-work')}>🔍 Find Work</button>
          <button className={currentPage === 'account' ? 'active' : ''} onClick={() => setCurrentPage('account')}>👤 Account</button>
          <button className={currentPage === 'summary' ? 'active' : ''} onClick={() => setCurrentPage('summary')}>📋 Flow Summary</button>

        {currentPage === 'home' && renderHome()}
        {currentPage === 'find-work' && renderFindWork()}
        {currentPage === 'messages' && <div className="content"><div className="card card-pad" style={{ textAlign: 'center', padding: 60, color: '#888' }}>💬 Messages — unchanged</div></div>}
        {currentPage === 'account' && renderAccount()}
        {currentPage === 'summary' && renderSummary()}
      </div>
      {renderBottomNav()}
    </div>
  );
};

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
